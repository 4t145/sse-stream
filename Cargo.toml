[package]
name = "sse-stream"
version = "0.2.6"
edition = "2021"
authors = ["4t145 <u4t145@163.com>"]
license = "MIT OR Apache-2.0"
readme = "README.md"
categories = ["network-programming", "asynchronous"]
keywords = ["sse", "http", "http-client"]
repository = "https://github.com/4t145/sse-stream/"
description = "Conversion between http body and sse stream"
documentation = "https://docs.rs/sse-stream"

[dependencies]
bytes = "1"
futures-util = { version = "0.3" }
http-body = "1"
http-body-util = "0.1"
pin-project-lite = "0.2"
memchr = { version = "2", optional = true }
simdutf8 = { version = "0.1.5", optional = true }
tracing = { version = "0.1", optional = true }

[dev-dependencies]
tokio-util = { version = "0.7", features = ["io"] }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["stream"] }
anyhow = "1"
tracing-subscriber = { version = "0.3", features = [
  "env-filter",
  "std",
  "fmt",
] }
serde = { version = "1", features = ["derive"] }
axum = { version = "0.8", features = ["tracing"] }
tracing = { version = "0.1" }
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
criterion = { version = "0.8", features = ["async_tokio"] }
tokio-stream = "0.1"
thiserror = "2"
sse-core = "0.2.3"

[[bench]]
name = "bench"
harness = false

[features]
default = ["memchr", "simdutf8"]
memchr = ["dep:memchr"]
simdutf8 = ["dep:simdutf8"]
tracing = ["dep:tracing"]
